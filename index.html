<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    canvas {
      width: 400px;
      height: 400px;
      background: green;
      cursor: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas width="400" height="400"></canvas>
    <div class="controls">
      <label for="count-input">Rectangles:</label>
      <input id="count-input" type="number" min="1" value="9">
      <button id="start-btn">Start</button>
      <button id="pause-btn" disabled>Pause</button>
    </div>
  </div>
  <script src="dist/main.js"></script>
</body>
</html>
